<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>คาเฟ่ดอยสูง — สั่งเมนู</title>
<style>
  :root {
    --accent: #2563eb;
    --accent-bg: #eff6ff;
    --success: #16a34a;
    --success-bg: #f0fdf4;
    --danger: #dc2626;
    --border: #e5e7eb;
    --text: #111827;
    --muted: #6b7280;
    --radius: 10px;
    --surface: #ffffff;
    --page: #f9fafb;
    box-sizing: border-box;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --accent: #60a5fa;
      --accent-bg: #1e3a5f;
      --success: #4ade80;
      --success-bg: #14532d;
      --danger: #f87171;
      --border: #374151;
      --text: #f9fafb;
      --muted: #9ca3af;
      --surface: #1f2937;
      --page: #111827;
    }
  }
  *, *::before, *::after { box-sizing: inherit; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--page); color: var(--text); min-height: 100vh; padding: env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px); }
  .wrap { max-width: 480px; margin: 0 auto; padding: 2rem 1rem; }
  .header { text-align: center; margin-bottom: 2rem; }
  .header .icon { font-size: 42px; }
  .header h1 { font-size: 22px; font-weight: 600; margin: 8px 0 4px; }
  .header p { font-size: 14px; color: var(--muted); }
  label { font-size: 14px; color: var(--muted); display: block; margin-bottom: 6px; }
  input[type=text] { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 15px; background: var(--surface); color: var(--text); outline: none; }
  input[type=text]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent); }
  .field { margin-bottom: 1.5rem; }
  .error { color: var(--danger); font-size: 13px; margin-top: 5px; display: none; }
  .menu-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 8px; background: var(--surface); }
  .menu-item.selected { border-color: var(--accent); background: var(--accent-bg); }
  .menu-name { font-size: 15px; font-weight: 500; }
  .menu-price { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .qty-controls { display: flex; align-items: center; gap: 10px; }
  .qty-btn { width: 30px; height: 30px; border: 1px solid var(--border); border-radius: 8px; background: var(--page); color: var(--text); font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .qty-btn:hover { background: var(--border); }
  .qty-num { font-size: 15px; font-weight: 500; min-width: 20px; text-align: center; }
  .summary { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1rem 1.25rem; margin: 1.5rem 0 1rem; }
  .summary-row { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); padding: 4px 0; }
  .total-row { display: flex; justify-content: space-between; font-size: 16px; font-weight: 600; padding: 10px 0 0; border-top: 1px solid var(--border); margin-top: 8px; }
  .btn-order { width: 100%; padding: 13px; background: var(--accent); color: #fff; border: none; border-radius: var(--radius); font-size: 16px; font-weight: 600; cursor: pointer; position: relative; }
  .btn-order:hover { opacity: 0.9; }
  .btn-order:disabled { opacity: 0.6; cursor: not-allowed; }
  .loading-spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid #fff; border-top-color: transparent; border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .success-box { background: var(--success-bg); border: 1px solid var(--success); border-radius: 12px; padding: 2rem; text-align: center; display: none; }
  .success-box .big { font-size: 48px; }
  .success-box h2 { font-size: 18px; font-weight: 600; color: var(--success); margin: 10px 0 6px; }
  .success-box p { font-size: 14px; color: var(--muted); margin-bottom: 1.25rem; }
  .btn-reset { background: transparent; border: 1px solid var(--border); border-radius: var(--radius); padding: 9px 24px; font-size: 14px; cursor: pointer; color: var(--text); }
  .sheets-badge { display: inline-flex; align-items: center; gap: 5px; background: #e8f5e9; color: #2e7d32; border-radius: 6px; font-size: 12px; padding: 4px 10px; margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="icon">☕</div>
    <h1>คาเฟ่ดอยสูง</h1>
    <p>สั่งเมนูโปรดของคุณได้เลย</p>
  </div>

  <div id="order-form">
    <div class="field">
      <label for="customer-name">ชื่อผู้สั่ง</label>
      <input type="text" id="customer-name" placeholder="กรอกชื่อของคุณ">
      <p class="error" id="name-error">กรุณากรอกชื่อก่อนสั่ง</p>
    </div>

    <label>เลือกเมนู</label>
    <div id="menu-list" style="margin-bottom:4px;"></div>
    <p class="error" id="menu-error">กรุณาเลือกเมนูอย่างน้อย 1 รายการ</p>

    <div class="summary">
      <div id="summary-items"></div>
      <div class="total-row">
        <span>ยอดรวม</span>
        <span id="total-price">฿0</span>
      </div>
    </div>

    <button class="btn-order" id="order-btn" onclick="placeOrder()">สั่งซื้อเลย</button>
    <p class="error" id="send-error" style="text-align:center;margin-top:8px;">เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง</p>
  </div>

  <div class="success-box" id="success-box">
    <div class="big">🎉</div>
    <h2 id="success-name"></h2>
    <p id="success-detail"></p>
    <div class="sheets-badge">📊 บันทึกลง Google Sheets แล้ว</div>
    <br><br>
    <button class="btn-reset" onclick="resetOrder()">สั่งอีกครั้ง</button>
  </div>
</div>

<script>
const SHEET_URL = "https://script.google.com/macros/s/AKfycbyBC5YkshubwJw4LipL0w8G8825guHNZSlyxAH3FL5k8YAqAcvZ1JWm3_2hUVx-KjZs/exec";

const menu = [
  { id:'a', name:'อเมริกาโน่', price:55 },
  { id:'b', name:'ลาเต้', price:65 },
  { id:'c', name:'คาปูชิโน่', price:65 },
  { id:'d', name:'มัทฉะลาเต้', price:75 },
  { id:'e', name:'ช็อกโกแลตร้อน', price:70 },
  { id:'f', name:'เค้กบัตเตอร์', price:85 },
];
const qty = {};
menu.forEach(m => qty[m.id] = 0);

function render() {
  document.getElementById('menu-list').innerHTML = menu.map(m => `
    <div class="menu-item ${qty[m.id] > 0 ? 'selected' : ''}">
      <div>
        <div class="menu-name">${m.name}</div>
        <div class="menu-price">฿${m.price}</div>
      </div>
      <div class="qty-controls">
        <button class="qty-btn" onclick="change('${m.id}',-1)">−</button>
        <span class="qty-num">${qty[m.id]}</span>
        <button class="qty-btn" onclick="change('${m.id}',1)">+</button>
      </div>
    </div>`).join('');

  const selected = menu.filter(m => qty[m.id] > 0);
  document.getElementById('summary-items').innerHTML = selected.length === 0
    ? '<p style="font-size:13px;color:var(--muted);margin-bottom:6px;">ยังไม่ได้เลือกเมนู</p>'
    : selected.map(m => `<div class="summary-row"><span>${m.name} × ${qty[m.id]}</span><span>฿${m.price * qty[m.id]}</span></div>`).join('');

  document.getElementById('total-price').textContent = '฿' + menu.reduce((s,m) => s + m.price * qty[m.id], 0);
}

function change(id, d) {
  qty[id] = Math.max(0, qty[id] + d);
  document.getElementById('menu-error').style.display = 'none';
  render();
}

async function placeOrder() {
  const name = document.getElementById('customer-name').value.trim();
  const hasItem = menu.some(m => qty[m.id] > 0);
  let ok = true;
  if (!name) { document.getElementById('name-error').style.display = 'block'; ok = false; }
  if (!hasItem) { document.getElementById('menu-error').style.display = 'block'; ok = false; }
  if (!ok) return;

  const items = menu.filter(m => qty[m.id] > 0).map(m => `${m.name} ×${qty[m.id]}`).join(', ');
  const total = menu.reduce((s,m) => s + m.price * qty[m.id], 0);

  // แสดง loading
  const btn = document.getElementById('order-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="loading-spinner"></span>กำลังบันทึก...';
  document.getElementById('send-error').style.display = 'none';

  try {
    const params = new URLSearchParams({ name, items, total });
    await fetch(SHEET_URL + '?' + params.toString(), {
      method: 'GET',
      mode: 'no-cors'
    });

    // แสดงหน้าสำเร็จ
    document.getElementById('order-form').style.display = 'none';
    document.getElementById('success-box').style.display = 'block';
    document.getElementById('success-name').textContent = `ขอบคุณค่า คุณ${name}!`;
    document.getElementById('success-detail').textContent = `${items} — ยอดรวม ฿${total}`;

  } catch(err) {
    btn.disabled = false;
    btn.innerHTML = 'สั่งซื้อเลย';
    document.getElementById('send-error').style.display = 'block';
  }
}

function resetOrder() {
  menu.forEach(m => qty[m.id] = 0);
  document.getElementById('customer-name').value = '';
  document.getElementById('order-form').style.display = 'block';
  document.getElementById('success-box').style.display = 'none';
  document.getElementById('name-error').style.display = 'none';
  document.getElementById('menu-error').style.display = 'none';
  document.getElementById('order-btn').disabled = false;
  document.getElementById('order-btn').innerHTML = 'สั่งซื้อเลย';
  render();
}

render();
</script>
</body>
</html>
